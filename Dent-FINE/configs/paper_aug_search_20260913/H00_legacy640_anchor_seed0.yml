task: detection
evaluator:
  type: CocoEvaluator
  iou_types:
  - bbox
num_classes: 32
remap_mscoco_category: false
fdi_label_order: dentex_enumeration32
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /home/wuxi/DENTEX2023/train2017
    ann_file: /home/wuxi/DENTEX2023/annotations/instances_train2017.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Mosaic
        output_size: 320
        rotation_range: 10
        translation_range:
        - 0.1
        - 0.1
        scaling_range:
        - 0.5
        - 1.5
        probability: 0.0
        fill_value: 0
        use_cache: false
        max_cached_images: 50
        random_pop: true
      - type: RandomPhotometricDistort
        p: 0.5
      - type: RandomZoomOut
        fill: 0
        p: 0.5
        side_range:
        - 1.0
        - 4.0
      - type: RandomIoUCrop
        p: 0.8
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: Resize
        size:
        - 640
        - 640
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
      policy:
        name: stop_epoch
        epoch:
        - 4
        - 70
        - 130
        ops:
        - Mosaic
        - RandomPhotometricDistort
        - RandomZoomOut
        - RandomIoUCrop
      mosaic_prob: 0.0
  shuffle: true
  num_workers: 8
  drop_last: true
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: 20
    stop_epoch: 130
    ema_restart_decay: 0.9999
    mixup_prob: 0.5
    mixup_epochs:
    - 4
    - 80
  total_batch_size: 8
val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /home/wuxi/DENTEX2023/val2017
    ann_file: /home/wuxi/DENTEX2023/annotations/instances_val2017.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Resize
        size:
        - 640
        - 640
      - type: ConvertPILImage
        dtype: float32
        scale: true
  shuffle: false
  num_workers: 8
  drop_last: false
  collate_fn:
    type: BatchImageCollateFunction
  total_batch_size: 16
print_freq: 100
output_dir: /home/wuxi/Dent-FINE/outputs/paper_aug_search_20260913/H00_legacy640_anchor/seed_0
checkpoint_freq: 1000000
sync_bn: true
find_unused_parameters: false
use_amp: true
scaler:
  type: GradScaler
  enabled: true
use_ema: true
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000
  start: 0
epoches: 160
clip_max_norm: 0.1
optimizer:
  type: AdamW
  params:
  - params: ^(?=.*backbone)(?!.*bn).*$
    lr: 0.00025
  - params: ^(?=.*(?:norm|bn)).*$
    weight_decay: 0.0
  lr: 0.0005
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0001
lr_scheduler:
  type: MultiStepLR
  milestones:
  - 500
  gamma: 0.1
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500
model: DEIM
criterion: DEIMCriterion
postprocessor: PostProcessor
use_focal_loss: true
eval_spatial_size:
- 640
- 640
DEIM:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 50
flat_epoch: 70
no_aug_epoch: 25
HGNetv2:
  pretrained: true
  local_model_dir: ../RT-DETR-main/D-FINE/weight/hgnetv2/
