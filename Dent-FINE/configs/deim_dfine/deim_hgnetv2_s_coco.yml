__include__: [
  './dfine_hgnetv2_s_coco.yml',
  '../base/deim.yml'
]

output_dir: ./outputs/deim_hgnetv2_s_coco

optimizer:
  type: AdamW
  params: 
    - 
      params: '^(?=.*backbone)(?!.*bn).*$'
      # lr: 0.0005
      lr: 0.00025
    - 
      params: '^(?=.*(?:norm|bn)).*$'     # except bias
      weight_decay: 0.

  # lr: 0.001
  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.0001


# Increase to search for the optimal ema
epoches: 160 # 120 + 4n

## Our LR-Scheduler
flat_epoch: 70    # 4 + epoch // 2, e.g., 40 = 4 + 72 / 2
# no_aug_epoch: 12
no_aug_epoch: 25

## Our DataAug
train_dataloader: 
  dataset: 
    transforms:
      policy:
        epoch: [4, 70, 130]   # list 

  collate_fn:
    mixup_epochs: [4, 80]
    stop_epoch: 130