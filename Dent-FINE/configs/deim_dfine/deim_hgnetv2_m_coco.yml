__include__: [
  './dfine_hgnetv2_m_coco.yml',
  '../base/deim.yml'
]

output_dir: ./outputs/deim_hgnetv2_m_coco

optimizer:
  type: AdamW
  params: 
    -
      params: '^(?=.*backbone)(?!.*bn).*$'
      # lr: 0.00008
      lr: 0.0001  # 从 5e-5 提升到 1e-4
    - 
      params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

  lr: 0.0004      # 从 2e-4 提升到 4e-4
  betas: [0.9, 0.999]
  weight_decay: 0.0001


# Increase to search for the optimal ema
epoches: 200 # 120 + 4n

## Our LR-Scheduler
flat_epoch: 80    # 延长平稳期（4 + 200//2 - 20）
no_aug_epoch: 20  # 延长增强期

## Our DataAug
train_dataloader: 
  dataset: 
    transforms:
      policy:
        epoch: [4, 80, 150]  # 调整阶段

  collate_fn:
    mixup_epochs: [4, 100]
    stop_epoch: 150