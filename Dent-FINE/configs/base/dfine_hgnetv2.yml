task: detection

model: DEIM
criterion: DEIMCriterion
postprocessor: PostProcessor

use_focal_loss: True
eval_spatial_size: [640,640] # h w
checkpoint_freq: 4    # save freq

DEIM:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer

# Add, default for step lr scheduler 
lrsheduler: flatcosine
lr_gamma: 1
warmup_iter: 500
flat_epoch: 4000000
no_aug_epoch: 0

HGNetv2:
  pretrained: True
  local_model_dir: ../RT-DETR-main/D-FINE/weight/hgnetv2/

HybridEncoder:
  in_channels: [512, 1024, 2048]
  feat_strides: [8, 16, 32]

  # intra
  hidden_dim: 256
  use_encoder_idx: [2]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.
  enc_act: 'gelu'

  # cross
  expansion: 1.0
  depth_mult: 1
  act: 'silu'

  # legacy Dent-FINE module
  use_hfsa: False

  # imported from DEIMv2
  use_wav_enhance: False
  use_stat_denoise: False
  use_multipath_fusion: False
  use_dynamic_rf: False
  use_mpc_multiscale_perception: False
  use_pqg_high_frequency: False
  pqg_high_freq_stages: [0, 1]
  use_cmfa_fusion: False
  use_pfesa: False
  pfesa_cutoff: 0.10
  use_ucan_lkd: False
  use_ucm_uncertainty: False
  use_retinex_prior: False
  use_hooa_attention: False
  use_multinex_prior: False
  use_msck_refiner: False
  msck_kernels: [3, 5, 7]
  use_csaf_filter: False
  csaf_filter_scale: 4
  use_csaf_dmssp: False
  use_rdvq_refiner: False
  rdvq_codebook_size: 64
  rdvq_temperature: 0.7
  use_datpp_refiner: False
  datpp_refiner_stages: [1, 2]
  datpp_n_heads: 8
  datpp_n_groups: 4
  datpp_stride: 2
  datpp_offset_range_factor: 2.0
  use_dcsam_dual_consistency: False
  use_iqp_quality_prior: False
  iqp_codebook_size: 16
  use_dformer_geometry_prior: False
  use_cdml_domain_adapter: False
  use_efruf_gradient_fusion: False
  efruf_unfold_steps: 2
  use_sinf_spatial_field: False
  sinf_num_blocks: 2
  use_smwg_spectral_wavelet: False
  use_dug_hoif_fusion: False
  dug_hoif_use_interleave: True
  dug_hoif_use_multibranch: True
  dug_hoif_use_uncertainty_routing: True
  dug_hoif_use_high_order: True
  dug_hoif_use_omni_gate: True
  dug_hoif_res_init: -2.0
  use_dswfm: False
  dswfm_use_dynamic_fourier: True
  dswfm_use_haar_detail: True
  dswfm_use_bidirectional: True
  dswfm_res_init: -2.4
  use_dced_cascade: False
  dced_stages: 1
  dced_use_dug_hoif: True
  dced_res_init: -2.2
  use_structural_entropy_frequency_refiner: False
  sefs_res_init: -2.0
  use_rot_equivariant_detail_refiner: False
  roteq_res_init: -2.0
  use_hedp_prompt_refiner: False
  hedp_prompt_count: 4
  hedp_res_init: -2.1
  use_sampg_sst_refiner: False
  sampg_res_init: -2.0
  use_segd_entropy_refiner: False
  segd_res_init: -2.0
  use_fsdetr_frequency_spatial_refiner: False
  fsdetr_res_init: -2.0
  use_df2net_dynamic_fusion: False
  df2net_res_init: -2.0
  use_sdconet_saliency_refiner: False
  sdconet_res_init: -2.0
  use_idgbr_boundary_refiner: False
  idgbr_res_init: -2.0
  use_bilalora_layer_adapter: False
  bilalora_rank: 8
  bilalora_topk: 2
  use_surmt_structure_bridge: False
  use_mav_sparse_interaction: False
  mav_sparse_ratio: 0.25
  use_cnm_ode_refiner: False
  cnm_ode_steps: 3
  cnm_ode_step_size: 0.35
  cnm_ode_res_init: -1.4
  use_cldyn_rsc: False
  cldyn_filter_num: 4
  cldyn_set_num: 4
  cldyn_vector_num: 8
  cldyn_res_init: -1.3
  use_ced_cascade_refiner: False
  ced_cascade_stages: 1
  ced_cascade_expansion: 0.5
  ced_cascade_res_init: -1.6
  paper_refine_apply: proj
  apply_extra_modules: proj
  apply_denoise_modules: proj
  apply_refine_modules: outs


DFINETransformer:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3

  num_layers: 6
  eval_idx: -1
  num_queries: 300

  num_denoising: 80
  label_noise_ratio: 0.5
  box_noise_scale: 1.0

  # NEW
  reg_max: 32
  reg_scale: 4

  # Auxiliary decoder layers dimension scaling
  # "eg. If num_layers: 6 eval_idx: -4,
  # then layer 3, 4, 5 are auxiliary decoder layers."
  layer_scale: 1  # 2


  num_points: [3, 6, 3] # [4, 4, 4] [3, 6, 3]
  cross_attn_method: default # default, discrete
  query_select_method: default # default, agnostic

  # legacy Dent-FINE modules disabled by default
  use_uni_gate: False
  use_uni_gate_infer: False
  uni_gate_apply_last_only: True
  use_qgp: False
  qgp_layers: []
  use_pgr_roi_reasoning: False
  roi_init_ratio: 0.5

  # tooth-ID factor decomposition and appearance prototype bank
  use_factor_heads: False
  factor_alpha_quad: 0.0
  factor_alpha_tooth: 0.0
  factor_alpha_dent: 0.0
  factor_fusion_train: False
  use_tooth_prototype: False
  prototype_count: 4
  prototype_tau: 0.20
  prototype_weight: 0.5
  prototype_fusion_weight: 0.0
  prototype_fusion_train: False
  return_query_feats: False

  # legacy-compatible factor prior switches
  use_fdi_factor_prior: False
  fdi_factor_logit_scale: 0.0
  use_fdi_spatial_prior: False
  fdi_prior_knn: 8
  fdi_prior_sigma: 0.12
  fdi_prior_jaw_scale: 0.08
  fdi_prior_neighbor_scale: 0.12
  fdi_prior_unique_scale: 0.04
  fdi_prior_dent_scale: 0.04
  use_spegc_prompt_graph: False
  spegc_num_prompts: 16
  spegc_graph_topk: 8
  spegc_ref_bias: 0.25
  spegc_res_scale: 0.20
  use_cluster_query_refiner: False
  cluster_num: 16
  cluster_graph_topk: 6
  cluster_ref_bias: 0.25
  cluster_res_scale: 0.20
  use_query_recovery_memory: False
  query_recovery_scale: 0.15
  use_pfrpn_query_adapter: False
  pfrpn_pool_size: 4
  pfrpn_cascade_steps: 2
  pfrpn_res_scale: 0.20
  use_tooth_template_prior: False
  tooth_template_count: 4
  tooth_template_scale: 0.08
  tooth_template_spatial_scale: 0.05
  tooth_template_sigma: 0.18
  use_anatomical_region_prior: False
  anatomical_region_scale: 0.08
  anatomical_region_sigma: 0.18


PostProcessor:
  num_top_queries: 300
  use_dental_spatial_prior: False
  spatial_prior_weight: 0.2
  use_dental_shape_prior: False
  shape_prior_weight: 0.05
  use_dental_appearance_prior: False
  appearance_prior_weight: 0.5
  appearance_tau: 0.20
  use_dental_view_prior: False
  dental_view_type: unknown
  view_prior_weight: 0.2
  use_global_assignment: False
  assignment_score_threshold: 0.01
  assignment_keep_unassigned: True


DEIMCriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: ['vfl', 'boxes', 'local']
  alpha: 0.75
  gamma: 2.0
  reg_max: 32
  use_fdi_anatomy_loss: False
  use_dsfed_dual_scale_kd: False
  dsfed_kd_temperature: 2.0
  dsfed_kd_weight: 0.05
  dsfed_box_kd_weight: 0.02
  dsfed_kd_topk_ratio: 0.20
  dsfed_kd_min_conf: 0.10
  dsfed_final_kd_weight: 0.02
  use_tooth_size_prior_loss: False
  nwd_normalizer: 0.08

  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
