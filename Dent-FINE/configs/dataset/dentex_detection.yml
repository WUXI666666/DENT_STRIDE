task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 32
remap_mscoco_category: False
fdi_label_order: dentex_enumeration32

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /home/wuxi/DENTEX2023/train2017
    ann_file: /home/wuxi/DENTEX2023/annotations/instances_train2017.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 8
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction


val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /home/wuxi/DENTEX2023/val2017
    ann_file: /home/wuxi/DENTEX2023/annotations/instances_val2017.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 8
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
