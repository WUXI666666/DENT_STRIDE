task: detection
evaluator:
  type: CocoEvaluator
  iou_types:
  - bbox
num_classes: 52
remap_mscoco_category: false
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /home/wuxi/View-Net3_fixed/datasets/dental_dslr_view_template_dataset_copy/images/train
    ann_file: /home/wuxi/Dent-FINE/datasets/viewnet3_dslr_fdi52/annotations/tooth_instances_train_fdi52.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Mosaic
        output_size: 640
        rotation_range: 10
        translation_range:
        - 0.1
        - 0.1
        scaling_range:
        - 0.5
        - 1.5
        probability: 1.0
        fill_value: 0
        use_cache: false
        max_cached_images: 50
        random_pop: true
      - type: RandomPhotometricDistort
        p: 0.5
      - type: RandomZoomOut
        fill: 0
      - type: RandomIoUCrop
        p: 0.5
      - type: AlignedSanitizeBoundingBoxes
        min_size: 1
      - type: Resize
        size:
        - 640
        - 640
      - type: AlignedSanitizeBoundingBoxes
        min_size: 1
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
      policy:
        name: stop_epoch
        epoch:
        - 4
        - 70
        - 130
        ops:
        - Mosaic
        - RandomPhotometricDistort
        - RandomZoomOut
        - RandomIoUCrop
      mosaic_prob: 1.0
  shuffle: true
  num_workers: 8
  drop_last: true
  collate_fn:
    type: AlignedBatchImageCollateFunction
    base_size: 640
    base_size_repeat: null
    stop_epoch: 130
    ema_restart_decay: 0.9999
    mixup_prob: 0.5
    mixup_epochs:
    - 4
    - 80
  total_batch_size: 8
val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /home/wuxi/View-Net3_fixed/datasets/dental_dslr_view_template_dataset_copy/images/val
    ann_file: /home/wuxi/Dent-FINE/datasets/viewnet3_dslr_fdi52/annotations/tooth_instances_val_fdi52.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Resize
        size:
        - 640
        - 640
      - type: ConvertPILImage
        dtype: float32
        scale: true
  shuffle: false
  num_workers: 8
  drop_last: false
  collate_fn:
    type: BatchImageCollateFunction
  total_batch_size: 16
print_freq: 100
output_dir: /home/wuxi/Dent-FINE-paper/materials/official_baselines_2026-09-10/runs/deim_s_paper_modules_mosaic640/dslr_plain/seed_0
checkpoint_freq: 1000000
sync_bn: false
find_unused_parameters: false
use_amp: true
scaler:
  type: GradScaler
  enabled: true
use_ema: true
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000
  start: 0
epoches: 160
clip_max_norm: 0.1
optimizer:
  type: AdamW
  params:
  - params: ^(?=.*backbone)(?!.*bn).*$
    lr: 0.00025
  - params: ^(?=.*(?:norm|bn)).*$
    weight_decay: 0.0
  lr: 0.0005
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0001
lr_scheduler:
  type: MultiStepLR
  milestones:
  - 500
  gamma: 0.1
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500
model: DEIM
criterion: DEIMCriterion
postprocessor: PostProcessor
use_focal_loss: true
eval_spatial_size:
- 640
- 640
DEIM:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 50
flat_epoch: 70
no_aug_epoch: 30
HGNetv2:
  pretrained: true
  local_model_dir: /home/wuxi/RT-DETR-main/D-FINE/weight/hgnetv2/
  name: B0
  return_idx:
  - 1
  - 2
  - 3
  freeze_at: -1
  freeze_norm: false
  use_lab: true
HybridEncoder:
  in_channels:
  - 256
  - 512
  - 1024
  feat_strides:
  - 8
  - 16
  - 32
  hidden_dim: 256
  use_encoder_idx:
  - 2
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  enc_act: gelu
  expansion: 0.5
  depth_mult: 0.34
  act: silu
DFINETransformer:
  feat_channels:
  - 256
  - 256
  - 256
  feat_strides:
  - 8
  - 16
  - 32
  hidden_dim: 256
  num_levels: 3
  num_layers: 3
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points:
  - 3
  - 6
  - 3
  cross_attn_method: default
  query_select_method: default
  activation: silu
  mlp_act: silu
PostProcessor:
  num_top_queries: 300
DEIMCriterion:
  weight_dict:
    loss_vfl: 1
    loss_bbox: 5
    loss_giou: 2
    loss_fgl: 0.15
    loss_ddf: 1.5
    loss_mal: 1
  losses:
  - mal
  - boxes
  - local
  alpha: 0.75
  gamma: 1.5
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2
      cost_bbox: 5
      cost_giou: 2
    alpha: 0.25
    gamma: 2.0
device: cuda
seed: 0
paper_modules:
  cohort: dslr
  cmfa: false
  structured: false
  spatial_shape: false
  dualopt: false
