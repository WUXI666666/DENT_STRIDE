print_freq: 100
output_dir: /home/wuxi/Dent-FINE-paper/materials/mobile_baselines_input1024_2026-10-19/runs/dome_detr_s/seed_0
checkpoint_freq: 1000000
sync_bn: true
find_unused_parameters: false
use_amp: true
scaler:
  type: GradScaler
  enabled: true
use_ema: true
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000
  start: 0
train_dataloader:
  dataset:
    transforms:
      type: Compose
      ops:
      - type: RandomPhotometricDistort
        p: 0.5
      - type: RandomZoomOut
        fill: 0
        p: 0.5
      - type: RandomIoUCrop
        p: 0.8
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: Resize
        size:
        - 1024
        - 1024
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
      policy:
        name: stop_epoch
        epoch: 130
        ops:
        - RandomPhotometricDistort
        - RandomZoomOut
        - RandomIoUCrop
    type: CocoDetection
    img_folder: /home/wuxi/coco/train
    ann_file: /home/wuxi/coco/train/annotations_fdi_types.json
    return_masks: false
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 1024
    base_size_repeat: null
    stop_epoch: 130
    mwas_window_size: 16
  shuffle: true
  total_batch_size: 4
  num_workers: 4
  type: DataLoader
  drop_last: true
val_dataloader:
  dataset:
    transforms:
      type: Compose
      ops:
      - type: Resize
        size:
        - 1024
        - 1024
      - type: ConvertPILImage
        dtype: float32
        scale: true
    type: CocoDetection
    img_folder: /home/wuxi/coco/valid
    ann_file: /home/wuxi/coco/valid/annotations_fdi_types.json
    return_masks: false
  shuffle: false
  total_batch_size: 4
  num_workers: 4
  type: DataLoader
  drop_last: false
  collate_fn:
    type: BatchImageCollateFunction
epoches: 160
clip_max_norm: 0.1
optimizer:
  type: AdamW
  params:
  - params: ^(?=.*backbone)(?!.*norm|bn).*$
    lr: 2.0e-05
  - params: ^(?=.*backbone)(?=.*norm|bn).*$
    lr: 2.0e-05
    weight_decay: 0.0
  - params: ^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$
    weight_decay: 0.0
  lr: 0.0002
  betas:
  - 0.9
  - 0.999
  weight_decay: 6.5e-05
lr_scheduler:
  type: MultiStepLR
  milestones:
  - 80
  - 120
  gamma: 0.8
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500
task: detection
model: DOME
criterion: DomeCriterion
postprocessor: DomePostProcessor
use_focal_loss: true
eval_spatial_size:
- 1024
- 1024
DOME:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DomeTransformer
HGNetv2:
  pretrained: true
  local_model_dir: /home/wuxi/Dent-FINE/third_party/dome_detr/weight/hgnetv2/
  name: B0
  return_idx:
  - 0
  - 1
  - 2
  - 3
  freeze_at: -1
  freeze_norm: false
  use_lab: true
HybridEncoder:
  in_channels:
  - 64
  - 256
  - 512
  - 1024
  feat_strides:
  - 4
  - 8
  - 16
  - 32
  hidden_dim: 256
  use_encoder_idx:
  - 3
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  enc_act: gelu
  expansion: 0.5
  depth_mult: 0.34
  act: silu
  use_hybrid: true
  use_deformable: false
  enc_n_points: 6
  num_feature_levels: 4
  use_defe: true
  defe_type: light
  use_mwas: true
  mwas_window_size: 16
DomeTransformer:
  feat_channels:
  - 256
  - 256
  - 256
  - 256
  feat_strides:
  - 4
  - 8
  - 16
  - 32
  hidden_dim: 256
  num_levels: 4
  num_layers: 3
  eval_idx: -1
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points:
  - 4
  - 4
  - 4
  - 4
  cross_attn_method: default
  query_select_method: default
  min_num_select: 300
  max_num_select: 1500
DomeCriterion:
  weight_dict:
    loss_vfl: 1
    loss_bbox: 5
    loss_giou: 2
    loss_fgl: 0.15
    loss_ddf: 1.5
  losses:
  - vfl
  - boxes
  - local
  alpha: 0.75
  gamma: 2.0
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2
      cost_bbox: 5
      cost_giou: 2
    alpha: 0.25
    gamma: 2.0
  defe_density_map_weight: 1
evaluator:
  type: CocoEvaluator
  iou_types:
  - bbox
num_classes: 52
remap_mscoco_category: false
fdi_label_order: fdi52
seed: 0
resume: null
tuning: null
